name: Mac app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build installer
        run: npx electron-vite build && npx electron-builder --mac --arm64 --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: finance-hub-mac
          path: release/*.dmg
      - name: Read version
        if: github.event_name == 'push'
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Finance Hub ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: release/*.dmg
          body: |
            Download the file for your Mac:
            - **Apple Silicon (M1/M2/M3/M4)**: `Finance-Hub-${{ env.VERSION }}-arm64.dmg`
            - **Intel**: `Finance-Hub-${{ env.VERSION }}-x64.dmg`

            First launch: macOS will say it can't verify the app. Open **System Settings → Privacy & Security**, scroll down and click **Open Anyway**.
